glob_matcher: doublestar
pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '**/*.{js,mjs,cjs,ts,mts,cts,tsx}'
      run: ./node_modules/.bin/eslint -- {staged_files}
    typecheck:
      # Whole project, once per commit: the type checker has no staged-files glob.
      run: npm run typecheck:all
    python-lint:
      glob: '**/*.py'
      run: ruff check -- {staged_files}
    python-format:
      glob: '**/*.py'
      run: ruff format --check -- {staged_files}
    prettier:
      glob: '**/*.{js,json,jsonc,md,mjs,yml}'
      run: ./node_modules/.bin/prettier --check -- {staged_files}
