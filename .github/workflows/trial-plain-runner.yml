name: Trial plain runner

# One-week comparison, not a required check. Runs the same commands as the
# "webkit" job in test.yml, on the plain runner with a browser install
# instead of the pinned Playwright container image. The Playwright package
# version is still checked; the container image cannot be, because this job
# has none.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-plain:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: '1.64.1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm i --no-save "playwright@${PLAYWRIGHT_VERSION}"
      - run: npx playwright install --with-deps webkit
      - name: Check Playwright package version
        run: node -e "process.exit(require('playwright/package.json').version==='1.64.1'?0:1)"
      - run: SALUTANT_BROWSER=webkit node --test tests/browser-protocol.test.js
