name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npm test

  webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    env:
      PLAYWRIGHT_VERSION: '1.63.0'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npm i --no-save "playwright@${PLAYWRIGHT_VERSION}"
      - name: Check Playwright version matches the container image
        run: node -e "process.exit(require('playwright/package.json').version==='1.63.0'?0:1)"
      - run: SALUTANT_BROWSER=webkit node --test tests/browser-protocol.test.js

  mutation:
    runs-on: ubuntu-latest
    env:
      STRYKER_VERSION: '10.1.1'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        file: [assets, crypto, headers, mail-mock, service, storage, stub-app, worker]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: >
          npx --yes "@stryker-mutator/core@${STRYKER_VERSION}" run
          --testRunner command
          --commandRunner.command "exec node --test tests/*.test.js"
          --mutate "src/${{ matrix.file }}.js"
          --reporters clear-text --coverageAnalysis off
          --concurrency 1 --timeoutMS 20000
