name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.counts.outputs.tests }}
      skipped: ${{ steps.counts.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Count the tests
        id: counts
        if: always()
        shell: bash
        run: |
          count() { grep -E "^(#|ℹ) $1 [0-9]+" test-output.txt | tail -n 1 | grep -oE '[0-9]+$' || true; }
          echo "tests=$(count tests)" >> "$GITHUB_OUTPUT"
          echo "skipped=$(count skipped)" >> "$GITHUB_OUTPUT"

  webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    env:
      PLAYWRIGHT_VERSION: '1.64.1'
    timeout-minutes: 15
    outputs:
      tests: ${{ steps.counts.outputs.tests }}
      skipped: ${{ steps.counts.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm i --no-save "playwright@${PLAYWRIGHT_VERSION}"
      - name: Check Playwright version matches the container image
        run: node -e "process.exit(require('playwright/package.json').version==='1.64.1'?0:1)"
      - name: Run the WebKit protocol tests
        shell: bash
        run: |
          set -o pipefail
          SALUTANT_BROWSER=webkit node --test tests/browser-protocol.test.js 2>&1 | tee webkit-output.txt
      - name: Count the WebKit tests
        id: counts
        if: always()
        shell: bash
        run: |
          count() { grep -E "^(#|ℹ) $1 [0-9]+" webkit-output.txt | tail -n 1 | grep -oE '[0-9]+$' || true; }
          echo "tests=$(count tests)" >> "$GITHUB_OUTPUT"
          echo "skipped=$(count skipped)" >> "$GITHUB_OUTPUT"

  # Final gate. Fails unless the test and webkit jobs succeeded, each ran
  # at least one test, and skips stay within what is allowed. The test job
  # may skip exactly the 2 browser tests that need SALUTANT_BROWSER
  # (tests/browser-protocol.test.js). The webkit job may skip none.
  # The mutation matrix is not part of this gate.
  suites-ran:
    name: Suites ran
    needs: [test, webkit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          TEST_RESULT: ${{ needs.test.result }}
          TEST_TESTS: ${{ needs.test.outputs.tests }}
          TEST_SKIPPED: ${{ needs.test.outputs.skipped }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
          WEBKIT_TESTS: ${{ needs.webkit.outputs.tests }}
          WEBKIT_SKIPPED: ${{ needs.webkit.outputs.skipped }}
        run: |
          fail=0
          check() {
            name="$1"; result="$2"; tests="${3:-0}"; skipped="${4:-0}"; allowed="$5"
            echo "$name: result=$result tests=$tests skipped=$skipped (allowed skipped: $allowed)"
            [ "$result" = success ] || { echo "  $name did not succeed"; fail=1; }
            [ "$tests" -ge 1 ] || { echo "  $name counted no tests"; fail=1; }
            [ "$skipped" -le "$allowed" ] || { echo "  $name skipped more than allowed"; fail=1; }
          }
          check test "$TEST_RESULT" "$TEST_TESTS" "$TEST_SKIPPED" 2
          check webkit "$WEBKIT_RESULT" "$WEBKIT_TESTS" "$WEBKIT_SKIPPED" 0
          exit "$fail"

  mutation:
    runs-on: ubuntu-latest
    env:
      STRYKER_VERSION: '10.1.1'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        file: [assets, crypto, headers, mail-mock, service, storage, stub-app, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: >
          npx --yes "@stryker-mutator/core@${STRYKER_VERSION}" run
          --testRunner command
          --commandRunner.command "exec node --test tests/*.test.js"
          --mutate "src/${{ matrix.file }}.js"
          --reporters clear-text --coverageAnalysis off
          --concurrency 1 --timeoutMS 20000
